<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MyAgent</title>
		<!--
			The window opens straight onto the boot splash defined below, so the skin
			has to be right before the first frame. The theme lives in localStorage and
			React only reads it back much later; without this a dark-theme user stared
			at a white window for the whole boot.
		-->
		<script>
			;(function () {
				try {
					var stored = localStorage.getItem("myagent-theme") || "light"
					if (stored === "system") {
						stored = window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light"
					}
					document.documentElement.setAttribute(
						"data-theme",
						stored === "dark" ? "dark" : "light",
					)
				} catch (error) {}
			})()
		</script>
		<style>
			/* Boot colors: they only matter until global.css loads, then --bg and
			   --muted take over - the splash therefore matches both themes exactly. */
			html {
				--boot-bg: #ffffff;
				--boot-muted: #64748b;
				--boot-ground: rgba(15, 23, 42, 0.26);
				--boot-shadow: rgba(15, 23, 42, 0.18);
			}
			html[data-theme="dark"] {
				--boot-bg: #09090b;
				--boot-muted: #71717a;
				--boot-ground: rgba(0, 0, 0, 0.62);
				--boot-shadow: rgba(0, 0, 0, 0.55);
			}

			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--bg, var(--boot-bg));
			}

			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 22px;
				background: var(--bg, var(--boot-bg));
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				-webkit-user-select: none;
				user-select: none;
				transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1);
			}

			/* React retires the splash once the sidebar has its rows. */
			#boot-splash.boot-splash--hidden {
				opacity: 0;
				pointer-events: none;
			}

			.boot-splash__stage {
				position: relative;
				display: grid;
				place-items: center;
				width: 96px;
				height: 96px;
			}

			.boot-splash__logo {
				display: block;
				width: 96px;
				height: 96px;
				border-radius: 24px;
				/* The icon is a cream tile: without a hairline it melts into a
				   light background. */
				box-shadow: 0 0 0 1px var(--boot-ring);
				filter: drop-shadow(0 14px 26px var(--boot-shadow));
				will-change: transform;
				animation: boot-splash-hop 1.4s cubic-bezier(0.36, 0.07, 0.19, 0.97)
					infinite;
			}

			.boot-splash__wordmark {
				margin: 0;
				font-size: 11px;
				font-weight: 600;
				line-height: 1;
				letter-spacing: 0.22em;
				text-indent: 0.22em;
				color: var(--muted, var(--boot-muted));
			}

			@keyframes boot-splash-hop {
				0%,
				100% {
					transform: translateY(0) scale(1, 1);
				}
				12% {
					transform: translateY(2px) scale(1.06, 0.94);
				}
				32% {
					transform: translateY(-24px) scale(0.96, 1.05);
				}
				52% {
					transform: translateY(0) scale(1.05, 0.95);
				}
				68% {
					transform: translateY(-7px) scale(0.99, 1.01);
				}
				82% {
					transform: translateY(0) scale(1.01, 0.99);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.boot-splash__logo {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>

		<!--
			Rendered by the document itself, not React: the bundle still has to be
			parsed and the first IPC round-trip has to answer, and this is what fills
			that window.
		-->

			role="status"
			aria-live="polite"
			aria-label="Loading MyAgent"

		<script type="module" src="./main.tsx"></script>

		<script>
			/* Never trap the user behind the animation: a failed bundle or a hung
			   IPC answer must still end at the app, not at a bouncing logo. */
			setTimeout(function () {
				var splash = document.getElementById("boot-splash")
				if (!splash || splash.dataset.hiding === "true") return
				splash.dataset.hiding = "true"
				splash.classList.add("boot-splash--hidden")
				setTimeout(function () {
					splash.remove()
				}, 520)
			}, 8000)
		</script>
